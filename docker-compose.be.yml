# docker-compose.be.yml
version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: tuyen_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # เปิดสิทธิ์พอร์ตหากคุณต้องการเชื่อมต่อจัดการข้อมูลภายนอก
    restart: always
    networks:
      - tuyen_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuyen_backend_prod
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres_db:5432/${POSTGRES_DB:-mydatabase}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SPOONACULAR_API_KEY=${SPOONACULAR_API_KEY}
      # ชี้ AI_SERVICE_URL ไปที่ IP ของเครื่อง EC2 AI Service
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://localhost:8001}
    ports:
      - "80:8000" # เปิดสิทธิ์พอร์ต 80 เพื่อใช้เป็น Public API เข้าเครื่องได้ทันที
    depends_on:
      - postgres_db
    restart: always
    networks:
      - tuyen_network

networks:
  tuyen_network:
    driver: bridge

volumes:
  postgres_prod_data:
