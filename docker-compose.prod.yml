# docker-compose.prod.yml
version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: tuyen_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    networks:
      - tuyen_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuyen_backend_prod
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres_db:5432/${POSTGRES_DB:-mydatabase}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SPOONACULAR_API_KEY=${SPOONACULAR_API_KEY}
    depends_on:
      - postgres_db
    restart: always
    networks:
      - tuyen_network

  ai_service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: tuyen_ai_prod
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - GEMINI_VISION_MODEL=gemini-2.5-flash
    restart: always
    networks:
      - tuyen_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tuyen_frontend_prod
    environment:
      # สำหรับใน Production จะตั้งชี้ไปหา API หลังบ้าน
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - tuyen_network

networks:
  tuyen_network:
    driver: bridge

volumes:
  postgres_prod_data:
